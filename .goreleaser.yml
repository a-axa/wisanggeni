# Release configuration (PRD Fase G5).
#
# GoReleaser builds the same binary for every target from one source tree. The
# version string comes from the git tag, so `wisanggeni --version` matches the
# release name exactly.
#
# Local dry run, without publishing:
#   goreleaser release --snapshot --clean
#
# Real release, after CI is green on main and the tag exists:
#   git tag -a v1.0.0 -m "v1.0.0"
#   git push origin v1.0.0
#   goreleaser release --clean
version: 2

project_name: wisanggeni

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: wisanggeni
    main: .
    binary: wisanggeni
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: wisanggeni
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - docs/FORMAT.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: a-axa
    name: wisanggeni
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
