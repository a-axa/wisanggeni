name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # The G3 detector is Python and never ships inside the Go binary, so it gets
  # its own job. It stays a no-op until detector/*.py exists.
  detector:
    name: detector (G3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: look for detector sources
        id: probe
        shell: bash
        run: |
          if compgen -G "detector/*.py" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.probe.outputs.found == 'true'
        with:
          python-version: "3.12"
      - name: compile detector
        if: steps.probe.outputs.found == 'true'
        run: |
          python -m pip install --upgrade numpy scikit-learn
          python -m compileall -q detector
