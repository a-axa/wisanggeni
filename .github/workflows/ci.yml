name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain, not go-version-file: macOS 26 (macos-latest) rejects
      # any binary without LC_UUID, which Go 1.25.8 and older can emit
      # (golang/go#78012). Fixed in Go 1.26. go.mod keeps "go 1.22" as the
      # language minimum.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # The G3 detector is Python and never ships inside the Go binary, so it gets
  # its own job. It stays a no-op until detector/*.py exists. The stc_ref.py
  # reference solver is stdlib-only and doubles as the independent oracle for
  # the Go STC vectors, so its --check runs here.
  detector:
    name: detector (G3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: look for detector sources
        id: probe
        shell: bash
        run: |
          if compgen -G "detector/*.py" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.probe.outputs.found == 'true'
        with:
          python-version: "3.12"
      - name: compile detector
        if: steps.probe.outputs.found == 'true'
        run: |
          python -m pip install --upgrade numpy scikit-learn
          python -m compileall -q detector
      - name: check stc reference vectors
        if: hashFiles('detector/stc_ref.py') != ''
        run: python detector/stc_ref.py --check internal/stego/testdata/stc_vectors.json
      # Build the binary so the steganalysis self-check can produce a real carrier
      # rather than only a synthetic control. The check asserts three things: the
      # pairs-of-values attack flags LSB replacement, it does not flag the clean
      # cover, and it does not flag the Wisanggeni carrier. A regression in the
      # embedder that started equalising histogram pairs would fail here.
      - uses: actions/setup-go@v5
        if: hashFiles('detector/steganalysis.py') != ''
        with:
          go-version: '1.26.x'
      - name: build wisanggeni for the steganalysis check
        if: hashFiles('detector/steganalysis.py') != ''
        run: go build -o /tmp/wisanggeni .
      - name: steganalysis self-check
        if: hashFiles('detector/steganalysis.py') != ''
        run: python detector/steganalysis.py --make-samples /tmp/g3 --self-check --binary /tmp/wisanggeni
